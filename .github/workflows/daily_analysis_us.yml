name: 每日美股自选股筛查（零 token）

# 自选股周更化 · 日层：每天读市场公开管道(market-data-collector)已算好的指标，
# 跑纯 Python 闸门，只推送「具备买入条件」的标的 + Python 数字。**不调用任何 LLM。**
#
# 原「每日美股分析」（main.py + 全套 LLM env）已由本零-token 日层 + weekly_watchlist.yml
# 取代。LLM 只在周末闲时跑一次（weekly tier）。

on:
  # 定时触发 - 每天北京时间 19:00 (UTC 11:00) —— 闲时（挪出 DeepSeek 高峰窗 06–10 UTC）
  schedule:
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

# 并发控制：同一时间只运行一个
concurrency:
  group: watchlist-daily
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行自选股筛查（日层 · 零 LLM）
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        run: |
          echo "⏰ $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S') BJT"
          python -m src.watchlist_pipeline --tier daily --notify
